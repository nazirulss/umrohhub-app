<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UmrohHub - Marketplace & Portal Umroh Terverifikasi Kemenag</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
  
  <style>
    /* ==========================================================================
       1. DESIGN TOKENS & ANTIGRAVITY ENGINE CSS VARIABLES
       ========================================================================== */
    :root {
      --primary-900: #064e3b;
      --primary-800: #065f46;
      --primary-700: #047857;
      --primary-600: #059669;
      --primary-500: #10b981;
      --primary-100: #d1fae5;
      --primary-50: #ecfdf5;

      --gold-600: #b45309;
      --gold-500: #d97706;
      --gold-400: #f59e0b;
      --gold-100: #fef3c7;
      --gold-50: #fffbeb;

      --slate-900: #0f172a;
      --slate-800: #1e293b;
      --slate-700: #334155;
      --slate-600: #475569;
      --slate-500: #64748b;
      --slate-400: #94a3b8;
      --slate-200: #e2e8f0;
      --slate-100: #f1f5f9;
      --slate-50: #f8fafc;
      --white: #ffffff;

      --danger-600: #dc2626;
      --danger-100: #fee2e2;
      --success-600: #16a34a;
      --success-100: #dcfce7;
      --info-600: #0284c7;
      --info-100: #e0f2fe;

      --font-main: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      --font-serif: 'Playfair Display', Georgia, serif;

      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 24px;
      --radius-full: 9999px;

      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.08), 0 2px 4px -2px rgb(0 0 0 / 0.05);
      --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.08), 0 4px 6px -4px rgb(0 0 0 / 0.03);
      --shadow-card: 0 12px 30px -10px rgba(6, 78, 59, 0.08);

      --ease-antigravity: cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* ==========================================================================
       2. BASE RESET & TYPOGRAPHY
       ========================================================================== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; font-size: 15px; }
    body {
      font-family: var(--font-main);
      color: var(--slate-800);
      background-color: var(--slate-50);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }
    h1, h2, h3, h4, h5, h6 { color: var(--slate-900); font-weight: 700; line-height: 1.25; }
    .font-serif { font-family: var(--font-serif); }
    a { color: inherit; text-decoration: none; }
    button { cursor: pointer; font-family: inherit; border: none; background: none; }
    input, select, textarea { font-family: inherit; font-size: inherit; }
    img { max-width: 100%; height: auto; display: block; }

    /* ==========================================================================
       3. ANTIGRAVITY ANIMATION & UTILITIES
       ========================================================================== */
    .ag-float { animation: agFloat 4s ease-in-out infinite; }
    .ag-pulse { animation: agPulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    .ag-fade-up { animation: agFadeUp 0.6s var(--ease-antigravity) forwards; }

    @keyframes agFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes agPulse {
      0%, 100% { opacity: 1; }
      50% { opacity: .6; }
    }
    @keyframes agFadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .container { width: 100%; max-width: 1240px; margin: 0 auto; padding: 0 20px; }

    .badge {
      display: inline-flex; align-items: center; gap: 5px; font-size: 0.75rem;
      font-weight: 700; padding: 4px 10px; border-radius: var(--radius-full);
      text-transform: uppercase; letter-spacing: 0.5px;
    }
    .badge-gold { background-color: var(--gold-100); color: var(--gold-600); border: 1px solid rgba(217, 119, 6, 0.3); }
    .badge-verified { background-color: var(--primary-100); color: var(--primary-800); border: 1px solid rgba(5, 150, 105, 0.3); }
    .badge-danger { background-color: var(--danger-100); color: var(--danger-600); }
    .badge-info { background-color: var(--info-100); color: var(--info-600); }
    .badge-slate { background-color: var(--slate-200); color: var(--slate-700); }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      font-weight: 600; padding: 10px 20px; border-radius: var(--radius-md);
      transition: all 0.2s var(--ease-antigravity); font-size: 0.92rem; white-space: nowrap;
    }
    .btn-primary { background: linear-gradient(135deg, var(--primary-700), var(--primary-800)); color: var(--white); box-shadow: 0 4px 12px rgba(6, 95, 70, 0.25); }
    .btn-primary:hover { background: linear-gradient(135deg, var(--primary-600), var(--primary-700)); transform: translateY(-2px); box-shadow: 0 6px 18px rgba(6, 95, 70, 0.35); }
    .btn-gold { background: linear-gradient(135deg, var(--gold-400), var(--gold-500)); color: var(--white); box-shadow: 0 4px 12px rgba(217, 119, 6, 0.25); }
    .btn-gold:hover { background: linear-gradient(135deg, var(--gold-500), var(--gold-600)); transform: translateY(-2px); }
    .btn-outline { border: 1.5px solid var(--slate-200); color: var(--slate-700); background: var(--white); }
    .btn-outline:hover { border-color: var(--primary-600); color: var(--primary-700); background: var(--primary-50); }
    .btn-outline-primary { border: 1.5px solid var(--primary-600); color: var(--primary-700); background: transparent; }
    .btn-outline-primary:hover { background: var(--primary-700); color: var(--white); }
    .btn-sm { padding: 6px 12px; font-size: 0.82rem; border-radius: var(--radius-sm); }
    .btn-lg { padding: 14px 28px; font-size: 1.05rem; border-radius: var(--radius-lg); }
    .btn-block { width: 100%; }

    .card {
      background-color: var(--white); border-radius: var(--radius-lg);
      border: 1px solid var(--slate-200); box-shadow: var(--shadow-sm);
      overflow: hidden; transition: all 0.3s var(--ease-antigravity);
    }
    .card:hover { box-shadow: var(--shadow-card); transform: translateY(-4px); border-color: rgba(6, 78, 59, 0.2); }

    /* ==========================================================================
       4. HEADER & NAVIGATION BAR
       ========================================================================== */
    .site-header {
      position: sticky; top: 0; z-index: 50; background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(12px); border-bottom: 1px solid var(--slate-200);
    }
    .nav-container { display: flex; align-items: center; justify-content: space-between; height: 74px; }
    .brand-logo { display: flex; align-items: center; gap: 10px; font-size: 1.4rem; font-weight: 800; color: var(--primary-900); }
    .brand-logo .kaaba-icon {
      width: 38px; height: 38px; background: linear-gradient(135deg, var(--primary-800), var(--primary-900));
      border-radius: 10px; display: flex; align-items: center; justify-content: center;
      color: var(--gold-400); box-shadow: 0 4px 10px rgba(6, 78, 59, 0.2);
    }
    .brand-logo span span { color: var(--gold-500); }

    .nav-menu { display: flex; align-items: center; gap: 28px; list-style: none; }
    .nav-link { font-weight: 600; color: var(--slate-600); transition: color 0.2s ease; position: relative; }
    .nav-link:hover, .nav-link.active { color: var(--primary-700); }
    .nav-link.active::after {
      content: ''; position: absolute; bottom: -8px; left: 0; width: 100%;
      height: 2.5px; background-color: var(--primary-600); border-radius: var(--radius-full);
    }

    .role-switcher-box {
      display: flex; align-items: center; gap: 10px; background: var(--slate-100);
      padding: 6px 12px; border-radius: var(--radius-full); border: 1px solid var(--slate-200);
    }
    .role-switcher-box label { font-size: 0.78rem; font-weight: 700; color: var(--slate-500); text-transform: uppercase; }
    .role-select { background: transparent; border: none; font-weight: 700; color: var(--primary-800); outline: none; font-size: 0.85rem; cursor: pointer; }

    /* ==========================================================================
       5. HERO & SEARCH ENGINE
       ========================================================================== */
    .hero-section {
      position: relative; background: linear-gradient(135deg, #033a2b 0%, #064e3b 50%, #0a5c47 100%);
      color: var(--white); padding: 65px 0 90px; overflow: hidden;
    }
    .hero-pattern {
      position: absolute; inset: 0; opacity: 0.08;
      background-image: radial-gradient(#ffffff 1.5px, transparent 1.5px), radial-gradient(#d97706 1.5px, transparent 1.5px);
      background-size: 32px 32px; background-position: 0 0, 16px 16px;
    }
    .hero-content { position: relative; z-index: 2; text-align: center; max-width: 840px; margin: 0 auto; }
    .hero-title { font-size: 2.75rem; color: var(--white); margin-bottom: 16px; letter-spacing: -0.5px; }
    .hero-title span { color: var(--gold-400); font-style: italic; }
    .hero-subtitle { font-size: 1.12rem; color: var(--primary-100); margin-bottom: 36px; font-weight: 400; }

    .search-panel {
      position: relative; background: var(--white); border-radius: var(--radius-xl);
      padding: 24px; box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.3); color: var(--slate-800); text-align: left;
    }
    .search-grid { display: grid; grid-template-columns: repeat(4, 1fr) auto; gap: 16px; align-items: flex-end; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group label { font-size: 0.8rem; font-weight: 700; color: var(--slate-600); text-transform: uppercase; letter-spacing: 0.5px; }
    .form-control {
      width: 100%; padding: 10px 14px; border-radius: var(--radius-md);
      border: 1.5px solid var(--slate-200); background-color: var(--slate-50);
      color: var(--slate-900); font-weight: 600; outline: none; transition: border-color 0.2s ease;
    }
    .form-control:focus { border-color: var(--primary-600); background-color: var(--white); }

    /* ==========================================================================
       6. MARKETPLACE & DASHBOARD LAYOUTS
       ========================================================================== */
    .section { padding: 70px 0; }
    .section-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 36px; }
    .section-title { font-size: 1.9rem; color: var(--slate-900); letter-spacing: -0.5px; }
    .section-subtitle { color: var(--slate-500); font-size: 0.98rem; margin-top: 4px; }

    .market-layout { display: grid; grid-template-columns: 270px 1fr; gap: 30px; }
    .filter-sidebar {
      background: var(--white); padding: 24px; border-radius: var(--radius-lg);
      border: 1px solid var(--slate-200); height: fit-content; position: sticky; top: 94px;
    }
    .filter-title { display: flex; justify-content: space-between; align-items: center; font-size: 1.1rem; margin-bottom: 20px; padding-bottom: 12px; border-bottom: 1px solid var(--slate-200); }
    .filter-section { margin-bottom: 22px; }
    .filter-section h4 { font-size: 0.88rem; font-weight: 700; color: var(--slate-700); margin-bottom: 10px; text-transform: uppercase; }
    .filter-option { display: flex; align-items: center; gap: 10px; font-size: 0.92rem; color: var(--slate-600); margin-bottom: 8px; cursor: pointer; }
    .filter-option input[type="checkbox"] { accent-color: var(--primary-700); width: 16px; height: 16px; }

    .packages-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 24px; }
    .package-card { display: flex; flex-direction: column; height: 100%; }
    .package-thumb-wrapper { position: relative; height: 190px; overflow: hidden; background: var(--slate-100); }
    .package-thumb { width: 100%; height: 100%; object-fit: cover; transition: transform 0.4s var(--ease-antigravity); }
    .package-card:hover .package-thumb { transform: scale(1.06); }
    .package-tag { position: absolute; top: 12px; left: 12px; z-index: 2; }
    
    .wishlist-btn {
      position: absolute; top: 12px; right: 12px; z-index: 2; width: 34px; height: 34px;
      border-radius: 50%; background: rgba(255, 255, 255, 0.9); display: flex; align-items: center;
      justify-content: center; color: var(--slate-400); transition: all 0.2s ease;
    }
    .wishlist-btn:hover, .wishlist-btn.active { color: var(--danger-600); background: var(--white); transform: scale(1.1); }

    .package-body { padding: 18px; display: flex; flex-direction: column; flex-grow: 1; }
    .travel-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .travel-name { font-size: 0.85rem; font-weight: 700; color: var(--slate-600); }
    .package-title { font-size: 1.1rem; font-weight: 700; color: var(--slate-900); margin-bottom: 12px; line-height: 1.35; }
    
    .spec-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; background: var(--slate-50); padding: 10px 12px; border-radius: var(--radius-md); margin-bottom: 16px; font-size: 0.82rem; }
    .spec-item { display: flex; align-items: center; gap: 6px; color: var(--slate-600); }

    .package-footer { margin-top: auto; padding-top: 14px; border-top: 1px solid var(--slate-100); display: flex; align-items: center; justify-content: space-between; }
    .price-val { font-size: 1.25rem; font-weight: 800; color: var(--primary-800); }

    /* Dashboards */
    .dashboard-layout { display: grid; grid-template-columns: 260px 1fr; min-height: calc(100vh - 74px); }
    .dashboard-sidebar { background: var(--white); border-right: 1px solid var(--slate-200); padding: 24px 16px; }
    .dashboard-profile-card { display: flex; align-items: center; gap: 12px; padding: 12px; background: var(--slate-50); border-radius: var(--radius-md); margin-bottom: 24px; border: 1px solid var(--slate-200); }
    .profile-img { width: 42px; height: 42px; border-radius: 50%; background: var(--primary-800); color: var(--white); display: flex; align-items: center; justify-content: center; font-weight: 700; }
    
    .dash-nav-btn { display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 14px; border-radius: var(--radius-md); color: var(--slate-600); font-weight: 600; font-size: 0.92rem; text-align: left; }
    .dash-nav-btn.active { background: var(--primary-50); color: var(--primary-800); font-weight: 700; }
    
    .dashboard-main { padding: 32px; background: var(--slate-50); }
    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 30px; }
    .kpi-card { background: var(--white); padding: 20px; border-radius: var(--radius-lg); border: 1px solid var(--slate-200); box-shadow: var(--shadow-sm); }
    .kpi-value { font-size: 1.7rem; font-weight: 800; color: var(--slate-900); }

    .table-container { background: var(--white); border-radius: var(--radius-lg); border: 1px solid var(--slate-200); overflow-x: auto; box-shadow: var(--shadow-sm); }
    .data-table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.9rem; }
    .data-table th { background: var(--slate-50); padding: 14px 18px; font-weight: 700; color: var(--slate-600); border-bottom: 1px solid var(--slate-200); text-transform: uppercase; font-size: 0.76rem; }
    .data-table td { padding: 14px 18px; border-bottom: 1px solid var(--slate-100); }

    /* Modals & Toasts */
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px);
      z-index: 100; display: flex; align-items: center; justify-content: center; padding: 20px;
      opacity: 0; pointer-events: none; transition: opacity 0.25s ease;
    }
    .modal-backdrop.open { opacity: 1; pointer-events: auto; }
    .modal-box { background: var(--white); border-radius: var(--radius-xl); max-width: 600px; width: 100%; max-height: 90vh; overflow-y: auto; box-shadow: var(--shadow-lg); }
    .modal-header { padding: 20px 24px; border-bottom: 1px solid var(--slate-200); display: flex; justify-content: space-between; align-items: center; }
    .modal-body { padding: 24px; }
    .modal-footer { padding: 18px 24px; border-top: 1px solid var(--slate-200); display: flex; justify-content: flex-end; gap: 12px; background: var(--slate-50); }

    .toast-container { position: fixed; bottom: 24px; right: 24px; z-index: 200; display: flex; flex-direction: column; gap: 10px; }
    .toast { background: var(--slate-900); color: var(--white); padding: 14px 20px; border-radius: var(--radius-md); box-shadow: var(--shadow-lg); border-left: 4px solid var(--primary-500); animation: agFadeUp 0.3s forwards; }

    .empty-state { text-align: center; padding: 50px 20px; color: var(--slate-500); }
    .site-footer { background: var(--slate-900); color: var(--slate-400); padding: 60px 0 30px; border-top: 1px solid var(--slate-800); font-size: 0.92rem; }

    /* Performance & Skeleton Loader */
    @keyframes agShimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    .skeleton-box {
      background: linear-gradient(90deg, var(--slate-100) 25%, var(--slate-200) 50%, var(--slate-100) 75%);
      background-size: 200% 100%;
      animation: agShimmer 1.4s infinite ease-in-out;
      border-radius: var(--radius-sm);
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header class="site-header">
    <div class="container nav-container">
      <a href="#" class="brand-logo" onclick="Router.navigate('home')">
        <div class="kaaba-icon">🕋</div>
        <span>Umroh<span>Hub</span></span>
      </a>

      <ul class="nav-menu">
        <li><a href="#" class="nav-link active" onclick="Router.navigate('home')">Beranda</a></li>
        <li><a href="#" class="nav-link" onclick="Router.navigate('marketplace')">Cari Paket</a></li>
        <li><a href="#" class="nav-link" onclick="Router.navigate('travels')">Travel Resmi</a></li>
        <li><a href="#" class="nav-link" onclick="Router.navigate('affiliate-info')">Mitra Affiliate</a></li>
      </ul>

      <div style="display: flex; align-items: center; gap: 14px;">
        <div class="role-switcher-box">
          <label for="role-select">Mode:</label>
          <select id="role-select" class="role-select" onchange="AuthStore.switchRole(this.value)">
            <option value="customer">Jamaah / Publik</option>
            <option value="travel">Travel Owner</option>
            <option value="affiliate">Affiliate Partner</option>
            <option value="admin">Platform Admin</option>
          </select>
        </div>
        <div id="auth-action-container"></div>
      </div>
    </div>
  </header>

  <!-- MAIN ROUTE OUTLET -->
  <main id="app-root" class="ag-fade-up"></main>

  <!-- FOOTER -->
  <footer class="site-footer">
    <div class="container" style="text-align: center;">
      <p>&copy; 2026 UmrohHub Platform. Diberdayakan oleh Arsitektur Headless Google Apps Script & Google Spreadsheet Cloud Database.</p>
    </div>
  </footer>

  <!-- MODAL CONTAINER -->
  <div class="modal-backdrop" id="global-modal" onclick="ModalManager.handleBackdropClick(event)">
    <div class="modal-box">
      <div class="modal-header">
        <h3 id="modal-title">Modal Title</h3>
        <button onclick="ModalManager.close()" style="font-size: 1.3rem;">&times;</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-footer" id="modal-footer"></div>
    </div>
  </div>

  <div class="toast-container" id="toast-container"></div>

  <!-- SCRIPT ENGINE -->
  <script>
    /* ==========================================================================
       0. SECURITY & SANITIZATION HELPERS (XSS HARDENING)
       ========================================================================== */
    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function safeUrl(value) {
      const fallback = "https://images.unsplash.com/photo-1591604129939-f1efa4d9f7fa?auto=format&fit=crop&w=700&q=80";
      if (!value) return fallback;
      const str = String(value).trim();
      if (str.startsWith("https://") || str.startsWith("http://") || str.startsWith("./") || str.startsWith("/") || str.startsWith("images/")) {
        return encodeURI(str);
      }
      return fallback;
    }

    /* ==========================================================================
       1. DATA LAYER (HEADLESS GAS ADAPTER & MOCK FALLBACK GUARD)
       ========================================================================== */
    const ApiClient = {
      ALLOW_MOCK_FALLBACK: true, // Configurable: Ubah ke false untuk strict live testing
      isMockFallbackActive: false,
      gasEndpointUrl: "https://script.google.com/macros/s/AKfycbyoOPC08Mm3l0FavsC_QOPo0BSfz_tbGqXLrZUUQKvkCPp3_DM8AMlxjRPAaS4JkFIa/exec",

      normalizePackage(pkg) {
        let departureDateStr = "Sesuai Jadwal";
        let departureCityStr = "Jakarta (CGK)";

        if (pkg.departures && pkg.departures.length > 0) {
          const dep = pkg.departures[0];
          if (dep.departureDate) {
            const d = new Date(dep.departureDate);
            departureDateStr = isNaN(d.getTime()) ? dep.departureDate : d.toISOString().split('T')[0];
          }
          if (dep.departureCity) departureCityStr = dep.departureCity;
        } else if (pkg.departureDate) {
          departureDateStr = pkg.departureDate;
        }

        return {
          id: pkg.id || "PKG-001",
          title: pkg.title || "Paket Umroh Reguler",
          travelName: pkg.travelName || "Al-Falah Tour & Travel",
          skKemenag: pkg.travelSK || "PPIU No. 412/2021",
          category: pkg.category || "Reguler",
          price: Number(pkg.price || 28500000),
          durationDays: Number(pkg.durationDays || 9),
          departureCity: departureCityStr,
          departureDate: departureDateStr,
          airline: pkg.airline || "Saudia Airlines",
          hotelMakkah: pkg.hotelMakkah || "Pullman Zamzam (★5)",
          hotelMadinah: pkg.hotelMadinah || "Rove Madinah (★4)",
          rating: 4.9,
          quotaTotal: pkg.quotaTotal || 45,
          quotaTaken: pkg.quotaTaken || 12,
          commissionAffiliate: Number(pkg.commissionAffiliate || 750000),
          image: pkg.image || "https://images.unsplash.com/photo-1591604129939-f1efa4d9f7fa?auto=format&fit=crop&w=700&q=80"
        };
      },

      getVisitorKey() {
        let key = localStorage.getItem('uh_visitor_key');
        if (!key) {
          key = 'vk_' + Math.random().toString(36).substring(2, 10) + Date.now().toString(36);
          localStorage.setItem('uh_visitor_key', key);
        }
        return key;
      },

      async fetchPackages(forceRefresh = false) {
        // 1. Cek LocalStorage Cache untuk instant rendering (< 10ms)
        const cachedRaw = localStorage.getItem('uh_cache_packages');
        if (cachedRaw && !forceRefresh) {
          try {
            const cached = JSON.parse(cachedRaw);
            if (Array.isArray(cached) && cached.length > 0) {
              this.db.packages = cached;
              // Background revalidation
              this.revalidatePackagesInBackground();
              return cached;
            }
          } catch (e) {}
        }
        return await this.revalidatePackagesInBackground();
      },

      async revalidatePackagesInBackground() {
        try {
          const response = await fetch(`${this.gasEndpointUrl}?action=packages.list`);
          const result = await response.json();
          if (result.success && Array.isArray(result.data)) {
            const normalized = result.data.map(p => this.normalizePackage(p));
            this.db.packages = normalized;
            localStorage.setItem('uh_cache_packages', JSON.stringify(normalized));
            this.isMockFallbackActive = false;
            AuthStore.renderAuthButton();
            
            // Re-render marketplace if active
            if (Router.currentRoute === 'marketplace') {
              Marketplace.renderCards(false);
            }
            return normalized;
          }
          throw new Error(result.message || "Gagal mengambil data dari Google Apps Script.");
        } catch (err) {
          console.warn("API FAILED — USING MOCK DATA", err);
          if (!this.ALLOW_MOCK_FALLBACK) {
            this.isMockFallbackActive = false;
            AuthStore.renderAuthButton();
            const root = document.getElementById('app-root');
            if (root && (!this.db.packages || this.db.packages.length === 0)) {
              root.innerHTML = `<div class="empty-state" style="color: var(--danger-600);"><p>⚠️ Gagal memuat data dari backend live API.</p><p style="font-size:0.8rem; color:var(--slate-500); margin-top:8px;">${escapeHtml(err.message)}</p></div>`;
            }
            return this.db.packages || [];
          }
          this.isMockFallbackActive = true;
          AuthStore.renderAuthButton();
          return this.db.packages;
        }
      },

      /**
       * Eksekusi request POST ke Apps Script Web App.
       * Menggunakan text/plain;charset=utf-8 untuk menghindari CORS preflight OPTIONS blocking.
       */
      async request(action, payload = {}) {
        const sessionToken = AuthStore.getSessionToken();
        const requestBody = { ...payload, sessionToken };

        try {
          const response = await fetch(`${this.gasEndpointUrl}?action=${action}&sessionToken=${encodeURIComponent(sessionToken)}`, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify(requestBody)
          });
          const result = await response.json();
          this.isMockFallbackActive = false;
          AuthStore.renderAuthButton();
          return result;
        } catch (err) {
          console.warn("API FAILED — USING MOCK DATA", err);
          this.isMockFallbackActive = true;
          AuthStore.renderAuthButton();
          if (!this.ALLOW_MOCK_FALLBACK) {
            Toast.show("Gagal memproses transaksi API ke server live.", "error");
            throw err;
          }
          Toast.show("Koneksi live terganggu. Menggunakan simulasi data prototype.", "warning");
          return { success: true, code: "MOCK_SIMULATED", message: "Simulasi berhasil dieksekusi", data: payload };
        }
      },

        } else {
          Toast.show(res ? res.message : "Booking gagal diproses.", "error");
        }

        Router.navigate('customer-dashboard');
      }
    };

    /* ==========================================================================
       5. DASHBOARDS (JAMAAH, TRAVEL, AFFILIATE, ADMIN)
       ========================================================================== */
    const CustomerDashboard = {
      async render() {
        const root = document.getElementById('app-root');
        root.innerHTML = '<div class="empty-state">Memuat data riwayat jamaah...</div>';

        let bookings = ApiClient.db.bookings;
        try {
          const res = await ApiClient.request('bookings.listCustomer');
          if (res && res.success && Array.isArray(res.data) && res.data.length > 0) {
            bookings = res.data;
          }
        } catch (e) {
          console.warn("Failed fetching live customer bookings, using fallback", e);
        }

        root.innerHTML = `
          <div class="dashboard-layout">
            <aside class="dashboard-sidebar">
              <div class="dashboard-profile-card">
                <div class="profile-img">AF</div>
                <div><h4>${escapeHtml(AuthStore.currentUser.name)}</h4><p style="font-size:0.75rem;">Jamaah</p></div>
              </div>
            </aside>
            <section class="dashboard-main">
              <h2>Dashboard Riwayat Jamaah</h2>
              <div class="table-container" style="margin-top: 20px;">
                <table class="data-table">
                  <thead><tr><th>ID Booking</th><th>Paket / Booking Code</th><th>Pax</th><th>Total</th><th>Status</th><th>Pembayaran</th></tr></thead>
                  <tbody>
                    ${bookings.map(b => `
                      <tr>
                        <td><strong>${escapeHtml(b.id || b.bookingCode)}</strong></td>
                        <td>${escapeHtml(b.packageName || b.bookingCode || b.packageId)}</td>
                        <td>${Number(b.paxCount || 1)} Pax</td>
                        <td>Rp ${Number(b.totalPrice || 0).toLocaleString('id-ID')}</td>
                        <td><span class="badge badge-info">${escapeHtml(b.status || 'PENDING')}</span></td>
                        <td><span class="badge badge-verified">${escapeHtml(b.paymentStatus || 'UNPAID')}</span></td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              </div>
            </section>
          </div>
        `;
      }
    };

    const TravelDashboard = {
      async render() {
        const root = document.getElementById('app-root');
        root.innerHTML = '<div class="empty-state">Memuat data travel operasional...</div>';

        let packagesCount = 1;
        let bookingsCount = 53;
        let travelPackages = [];
        let travelBookings = [];

        try {
          const [pkgRes, bkgRes] = await Promise.all([
            ApiClient.request('travel.packages.list'),
            ApiClient.request('bookings.listTravel')
          ]);
          if (pkgRes && pkgRes.success && Array.isArray(pkgRes.data)) {
            travelPackages = pkgRes.data;
            packagesCount = travelPackages.length;
          }
          if (bkgRes && bkgRes.success && Array.isArray(bkgRes.data)) {
            travelBookings = bkgRes.data;
            bookingsCount = travelBookings.reduce((sum, b) => sum + Number(b.paxCount || 0), 0) || travelBookings.length;
          }
        } catch (e) {
          console.warn("Failed fetching live travel data, using fallback", e);
        }

        root.innerHTML = `
          <div class="dashboard-layout">
            <aside class="dashboard-sidebar">
              <div class="dashboard-profile-card"><div class="profile-img" style="background:var(--gold-600);">TR</div><div><h4>Al-Falah Travel</h4><p style="font-size:0.75rem;">Biro PPIU Terverifikasi</p></div></div>
            </aside>
            <section class="dashboard-main">
              <h2>Manajemen Operasional Travel</h2>
              <div class="kpi-grid" style="margin-top:20px;">
                <div class="kpi-card"><div class="kpi-value">${bookingsCount} Jamaah</div><p style="font-size:0.8rem;">Total Terdaftar</p></div>
                <div class="kpi-card"><div class="kpi-value">${packagesCount} Paket</div><p style="font-size:0.8rem;">Kelola Paket (Draft & Published)</p></div>
              </div>
              ${travelBookings.length > 0 ? `
                <div class="table-container" style="margin-top: 24px;">
                  <h3 style="margin-bottom: 12px;">Daftar Booking Masuk</h3>
                  <table class="data-table">
                    <thead><tr><th>ID</th><th>Jamaah</th><th>Pax</th><th>Total</th><th>Status</th><th>Pembayaran</th></tr></thead>
                    <tbody>
                      ${travelBookings.slice(0, 8).map(b => `
                        <tr>
                          <td><strong>${escapeHtml(b.bookingCode || b.id)}</strong></td>
                          <td>${escapeHtml(b.jamaahName)}<br><small style="color:var(--slate-500);">${escapeHtml(b.jamaahPhone)}</small></td>
                          <td>${Number(b.paxCount)} Pax</td>
                          <td>Rp ${Number(b.totalPrice).toLocaleString('id-ID')}</td>
                          <td><span class="badge ${b.status === 'CONFIRMED' ? 'badge-verified' : 'badge-info'}">${escapeHtml(b.status)}</span></td>
                          <td><span class="badge ${b.paymentStatus === 'FULL_PAID' ? 'badge-verified' : 'badge-gold'}">${escapeHtml(b.paymentStatus)}</span></td>
                        </tr>
                      `).join('')}
                    </tbody>
                  </table>
                </div>
              ` : ''}
            </section>
          </div>
        `;
      }
    };

    const AffiliateDashboard = {
      async render() {
        const root = document.getElementById('app-root');
        root.innerHTML = '<div class="empty-state">Memuat data affiliate...</div>';

        const aff = ApiClient.db.affiliates[0];
        let clicksCount = Number(aff.clicks);
        let unpaidComm = Number(aff.unpaidCommission);
        let commissionsList = [];

        try {
          const res = await ApiClient.request('commissions.list');
          if (res && res.success && Array.isArray(res.data)) {
            commissionsList = res.data;
            if (commissionsList.length > 0) {
              unpaidComm = commissionsList
                .filter(c => c.status === 'PENDING' || c.status === 'APPROVED')
                .reduce((sum, c) => sum + Number(c.amount || 0), 0);
            }
          }
        } catch (e) {
          console.warn("Failed fetching live affiliate commissions, using fallback", e);
        }

        root.innerHTML = `
          <div class="dashboard-layout">
            <aside class="dashboard-sidebar">
              <div class="dashboard-profile-card"><div class="profile-img" style="background:var(--gold-500);">UA</div><div><h4>${escapeHtml(aff.name)}</h4><p style="font-size:0.75rem;">Mitra Affiliate Resmi</p></div></div>
            </aside>
            <section class="dashboard-main">
              <h2>Dashboard Affiliate Partner</h2>
              <div class="kpi-grid" style="margin-top:20px;">
                <div class="kpi-card"><div class="kpi-value">${clicksCount}</div><p style="font-size:0.8rem;">Total Klik Link (30-Day Window)</p></div>
                <div class="kpi-card"><div class="kpi-value">Rp ${unpaidComm.toLocaleString('id-ID')}</div><p style="font-size:0.8rem;">Komisi Akumulasi</p></div>
              </div>
              ${commissionsList.length > 0 ? `
                <div class="table-container" style="margin-top: 24px;">
                  <h3 style="margin-bottom: 12px;">Riwayat Komisi Afiliasi</h3>
                  <table class="data-table">
                    <thead><tr><th>ID Komisi</th><th>Booking Ref</th><th>Jumlah</th><th>Status</th></tr></thead>
                    <tbody>
                      ${commissionsList.map(c => `
                        <tr>
                          <td><strong>${escapeHtml(c.id)}</strong></td>
                          <td>${escapeHtml(c.bookingId)}</td>
                          <td>Rp ${Number(c.amount).toLocaleString('id-ID')}</td>
                          <td><span class="badge ${c.status === 'APPROVED' || c.status === 'PAID' ? 'badge-verified' : 'badge-gold'}">${escapeHtml(c.status)}</span></td>
                        </tr>
                      `).join('')}
                    </tbody>
                  </table>
                </div>
              ` : ''}
            </section>
          </div>
        `;
      }
    };

    const AdminDashboard = {
      async render() {
        const root = document.getElementById('app-root');
        root.innerHTML = '<div class="empty-state">Memuat data pusat kontrol legalitas...</div>';

        let travelsTotal = ApiClient.db.travels.length;
        let bookingsTotal = ApiClient.db.bookings.length;
        let commissionsTotal = 0;
        let travelsList = [];

        try {
          const [dashRes, travelsRes] = await Promise.all([
            ApiClient.request('admin.dashboard'),
            ApiClient.request('admin.travels')
          ]);
          if (dashRes && dashRes.success && dashRes.data) {
            travelsTotal = dashRes.data.travelsTotal || travelsTotal;
            bookingsTotal = dashRes.data.bookingsTotal || bookingsTotal;
            commissionsTotal = dashRes.data.commissionsTotal || 0;
          }
          if (travelsRes && travelsRes.success && Array.isArray(travelsRes.data)) {
            travelsList = travelsRes.data;
          }
        } catch (e) {
          console.warn("Failed fetching live admin data, using fallback", e);
        }

        root.innerHTML = `
          <div class="dashboard-layout">
            <aside class="dashboard-sidebar">
              <div class="dashboard-profile-card"><div class="profile-img" style="background:var(--slate-900);">AD</div><div><h4>Platform Admin</h4><p style="font-size:0.75rem;">Pengawasan Kemenag</p></div></div>
            </aside>
            <section class="dashboard-main">
              <h2>Pusat Kontrol Legalitas Kemenag</h2>
              <div class="kpi-grid" style="margin-top:20px;">
                <div class="kpi-card"><div class="kpi-value">${travelsTotal} Biro</div><p style="font-size:0.8rem;">Total Terdaftar Platform</p></div>
                <div class="kpi-card"><div class="kpi-value">${bookingsTotal} Booking</div><p style="font-size:0.8rem;">Total Transaksi Jamaah</p></div>
                <div class="kpi-card"><div class="kpi-value">${commissionsTotal} Komisi</div><p style="font-size:0.8rem;">Total Klaim Afiliasi</p></div>
              </div>
              ${travelsList.length > 0 ? `
                <div class="table-container" style="margin-top: 24px;">
                  <h3 style="margin-bottom: 12px;">Status Pengawasan PPIU Kemenag</h3>
                  <table class="data-table">
                    <thead><tr><th>Nama Travel</th><th>No. Izin PPIU</th><th>Kota</th><th>Status Kemenag</th></tr></thead>
                    <tbody>
                      ${travelsList.map(t => `
                        <tr>
                          <td><strong>${escapeHtml(t.name)}</strong></td>
                          <td>${escapeHtml(t.skKemenag)}</td>
                          <td>${escapeHtml(t.city)}</td>
                          <td><span class="badge ${t.status === 'VERIFIED' ? 'badge-verified' : (t.status === 'PENDING' ? 'badge-gold' : 'badge-danger')}">${escapeHtml(t.status)}</span></td>
                        </tr>
                      `).join('')}
                    </tbody>
                  </table>
                </div>
              ` : ''}
            </section>
          </div>
        `;
      }
    };

    /* ==========================================================================
       6. MODAL & TOAST MANAGERS
       ========================================================================== */
    const ModalManager = {
      open({ title, body, footer = '' }) {
        document.getElementById('modal-title').textContent = title;
        document.getElementById('modal-body').innerHTML = body;
        document.getElementById('modal-footer').innerHTML = footer;
        document.getElementById('global-modal').classList.add('open');
      },
      close() { document.getElementById('global-modal').classList.remove('open'); },
      handleBackdropClick(e) { if (e.target.id === 'global-modal') this.close(); }
    };

    const Toast = {
      show(message, type = 'info') {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        toast.className = `toast ${type}`;
        const span = document.createElement('span');
        span.textContent = message;
        toast.appendChild(span);
        container.appendChild(toast);
        setTimeout(() => toast.remove(), 3500);
      }
    };

    /* ==========================================================================
       7. GLOBAL INITIALIZER & REFERRAL ATTRIBUTION ROUTER
       ========================================================================== */
    window.addEventListener('DOMContentLoaded', async () => {
      AuthStore.init();

      // Cek Referral URL Parameters (?ref=...&packageId=...)
      const urlParams = new URLSearchParams(window.location.search);
      const refCode = urlParams.get('ref');
      const targetPackageId = urlParams.get('packageId');

      if (refCode) {
        const visitorKey = ApiClient.getVisitorKey();
        try {
          await ApiClient.request('referrals.track', {
            refCode: refCode,
            packageId: targetPackageId || '',
            visitorKey: visitorKey
          });
          Toast.show(`Terkoneksi dengan link referral mitra: ${refCode}`, "info");
        } catch (e) {
          console.warn("Gagal tracking referral", e);
        }
      }

      if (targetPackageId) {
        Router.navigate('package-detail', targetPackageId);
      } else {
        Router.navigate('home');
      }

      // Pre-warm data cache in background
      ApiClient.fetchPackages();
    });
  </script>
</body>
</html>
